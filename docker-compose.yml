services:
  indapt-front:
    image: indapt-front:latest
    container_name: indapt-front
    restart: unless-stopped
    ports:
      - "80:3000"
    environment:
      NODE_ENV: production
      NUXT_PUBLIC_API_BASE_URL: ${NUXT_PUBLIC_API_BASE_URL:-https://jsonplaceholder.typicode.com}
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
